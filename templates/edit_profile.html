<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Profile - CookBook :DR2</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; display: flex; background: #f4f6f8; }
        .sidebar { width: 220px; background: #1a2530; color: white; height: 100vh; padding: 20px; position: fixed; }
        .sidebar h2 { color: #4caf50; }
        .sidebar a { display: block; color: #b0bec5; text-decoration: none; padding: 15px 0; border-bottom: 1px solid #2c3e50; }
        .sidebar a:hover { color: white; }
        .main-content { margin-left: 260px; padding: 40px; flex: 1; }
        .recipe-form { display: flex; flex-direction: column; gap: 15px; max-width: 500px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .recipe-form input, .recipe-form textarea { padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; font-family: Arial;}
        .recipe-form button { padding: 12px; background: #4caf50; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>CookBook :DR2</h2>
        <a href="/">🏠 Home</a>
        <a href="/add-recipe">➕ Add Recipe</a>
        <a href="/my-recipes">🍳 My Recipes</a>
        <a href="/favorites">❤️ Favorites</a>
        <a href="/profile" style="color:white;">👤 Profile & Settings</a>
    </div>
    <div class="main-content">
        <h1>✏️ Edit Profile</h1>
        <form class="recipe-form" action="/edit-profile" method="POST">
            <label>Bio / About Me:</label>
            <textarea name="bio" rows="4" placeholder="Tell us about yourself (e.g., Computer Science Student, loves baking...)">{{ user.bio }}</textarea>
            
            <label>Change Password (leave blank to keep current):</label>
            <input type="password" name="password" placeholder="Type a new password...">
            
            <button type="submit">Save Changes</button>
            <a href="/profile" style="text-align: center; color: #666; margin-top: 10px; text-decoration: none;">Cancel</a>
        </form>
    </div>
</body>
</html>
