<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register - CookBook :DR2</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f6f8; }
        .auth-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        .auth-container h1 { color: #1a2530; margin-bottom: 20px; }
        .auth-container input { width: 90%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;}
        .auth-container button { width: 100%; padding: 12px; background: #4caf50; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .auth-container button:hover { background: #45a049; }
        .error { color: white; background: #e53935; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>Join CookBook</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form action="/register" method="POST">
            <input type="text" name="username" placeholder="Choose a Username" required>
            <input type="password" name="password" placeholder="Create a Password" required>
            <button type="submit">Register</button>
        </form>
        <p style="margin-top: 20px;">Already have an account? <a href="/login">Login</a></p>
    </div>
</body>
</html>
